name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          archive="dibs_${GOOS}_${GOARCH}"
          mkdir -p "dist/${archive}"
          revision="$(git rev-parse HEAD)"
          ldflags="-X github.com/abevz/dibs/internal/build.Revision=${revision}"
          go build -buildvcs=false -ldflags "${ldflags}" -o "dist/${archive}/dibs" ./cmd/dibs/
          go build -buildvcs=false -ldflags "${ldflags}" -o "dist/${archive}/dibsd" ./cmd/dibsd/
          go build -buildvcs=false -ldflags "${ldflags}" -o "dist/${archive}/dibs-mcp" ./cmd/dibs-mcp/
          tar -C "dist/${archive}" -czf "dist/${archive}.tar.gz" dibs dibsd dibs-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: dibs-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish GitHub release
        run: |
          set -euo pipefail
          cd release-artifacts
          sha256sum *.tar.gz > checksums.txt
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" *.tar.gz checksums.txt --clobber
          else
            gh release create "${VERSION}" *.tar.gz checksums.txt \
              --title "${VERSION}" \
              --notes "af-coordinator ${VERSION}"
          fi

